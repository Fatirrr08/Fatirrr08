<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <filter id="bgGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
    <filter id="particleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
    </filter>

    <pattern id="bgGridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#88C0D0" opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(60px, -30px); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-50px, 40px); }
      }
      @keyframes pulseNode {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.8; }
      }
      .orb1 { animation: floatOrb1 12s ease-in-out infinite; }
      .orb2 { animation: floatOrb2 14s ease-in-out infinite; }
      .node { animation: pulseNode 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#mainBg)" />

  <g class="orb1">
    <circle cx="250" cy="120" r="160" fill="#88C0D0" opacity="0.12" filter="url(#bgGlow)" />
    <circle cx="950" cy="300" r="180" fill="#81A1C1" opacity="0.15" filter="url(#bgGlow)" />
  </g>
  <g class="orb2">
    <circle cx="600" cy="200" r="130" fill="#5E81AC" opacity="0.12" filter="url(#bgGlow)" />
    <circle cx="150" cy="320" r="100" fill="#A3BE8C" opacity="0.08" filter="url(#bgGlow)" />
  </g>

  <rect width="1200" height="400" rx="16" fill="url(#bgGridPattern)" />

  <g stroke="#88C0D0" stroke-width="1" opacity="0.2">
    <line x1="180" y1="90" x2="320" y2="160" />
    <line x1="320" y1="160" x2="480" y2="110" />
    <line x1="720" y1="280" x2="860" y2="210" />
    <line x1="860" y1="210" x2="1020" y2="290" />
  </g>

  <circle cx="180" cy="90" r="3" fill="#88C0D0" class="node" filter="url(#particleGlow)" />
  <circle cx="320" cy="160" r="2.5" fill="#81A1C1" class="node" />
  <circle cx="480" cy="110" r="3" fill="#ECEFF4" class="node" filter="url(#particleGlow)" />
  <circle cx="720" cy="280" r="3" fill="#88C0D0" class="node" />
  <circle cx="860" cy="210" r="3.5" fill="#A3BE8C" class="node" filter="url(#particleGlow)" />
  <circle cx="1020" cy="290" r="2.5" fill="#81A1C1" class="node" />

  <rect width="1198" height="398" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1" opacity="0.6" />
</svg>
