<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <filter id="meshGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <pattern id="cardGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.75" opacity="0.3" />
      <circle cx="28" cy="28" r="1.2" fill="#88C0D0" opacity="0.25" />
    </pattern>

    <style>
      @keyframes floatBeamA {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(40px, -20px); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .beamA { animation: floatBeamA 10s ease-in-out infinite; }
      .pDot { animation: pulseDot 2.5s ease-in-out infinite; }
      .head-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 18px;
        font-weight: 800;
        fill: #ECEFF4;
        letter-spacing: 1.5px;
      }
      .sub-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        fill: #94A3B8;
      }
      .card-title {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        font-weight: 700;
        fill: #88C0D0;
      }
      .card-detail {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 11px;
        fill: #CBD5E1;
      }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1000" height="240" rx="14" fill="url(#cyberBg)" />
  <rect width="1000" height="240" rx="14" fill="url(#cardGrid)" />

  <!-- Animated Glowing Mesh -->
  <g class="beamA">
    <circle cx="200" cy="60" r="130" fill="#88C0D0" opacity="0.14" filter="url(#meshGlow)" />
    <circle cx="850" cy="180" r="140" fill="#81A1C1" opacity="0.15" filter="url(#meshGlow)" />
  </g>

  <!-- Constellation Nodes -->
  <g stroke="#88C0D0" stroke-width="0.8" opacity="0.25">
    <line x1="80" y1="50" x2="160" y2="110" />
    <line x1="820" y1="60" x2="920" y2="130" />
  </g>
  <circle cx="80" cy="50" r="2.5" fill="#88C0D0" class="pDot" />
  <circle cx="160" cy="110" r="2" fill="#81A1C1" />
  <circle cx="920" cy="130" r="3" fill="#A3BE8C" class="pDot" />

  <!-- Outer Border -->
  <rect width="998" height="238" x="1" y="1" rx="13" fill="none" stroke="#334155" stroke-width="1.2" />

  <!-- Header Inside Background -->
  <g transform="translate(50, 42)">
    <text x="0" y="0" class="head-title">CORE SYSTEM FOCUS &amp; CAPABILITIES</text>
    <text x="0" y="22" class="sub-desc">Arsitektur aplikasi terdistribusi, rekayasa model AI terapan, dan ekosistem modern web</text>
  </g>

  <!-- 3 Inner Glassmorphism Cards -->
  <!-- Card 1 -->
  <g transform="translate(50, 92)">
    <rect width="280" height="110" rx="10" fill="#0b1120" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" class="card-title">⚡ Modern Full-Stack</text>
    <text x="20" y="58" class="card-detail">Next.js 14, React &amp; TypeScript</text>
    <text x="20" y="76" class="card-detail">Tailwind CSS &amp; State Management</text>
    <text x="20" y="94" class="card-detail">Cloud DB (Supabase / Firebase)</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(360, 92)">
    <rect width="280" height="110" rx="10" fill="#0b1120" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" class="card-title">👁️ Vision &amp; AI Search</text>
    <text x="20" y="58" class="card-detail">Computer Vision: YOLO &amp; MediaPipe</text>
    <text x="20" y="76" class="card-detail">Semantic &amp; Vector Embeddings</text>
    <text x="20" y="94" class="card-detail">Gemini API &amp; LLM Automation</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(670, 92)">
    <rect width="280" height="110" rx="10" fill="#0b1120" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" class="card-title">🐹 High-Perf Backend</text>
    <text x="20" y="58" class="card-detail">Golang Goroutines &amp; Channels</text>
    <text x="20" y="76" class="card-detail">Socket / Network Streaming</text>
    <text x="20" y="94" class="card-detail">Payment API &amp; Microservices</text>
  </g>
</svg>
