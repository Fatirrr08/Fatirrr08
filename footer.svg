<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 120" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#88C0D0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#81A1C1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#5E81AC" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5E81AC" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#88C0D0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A3BE8C" stop-opacity="0.8" />
    </linearGradient>

    <pattern id="footerGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#2e3440" stroke-width="0.5" opacity="0.35" />
    </pattern>

    <style>
      @keyframes floatWave1 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-35px); }
        100% { transform: translateX(0px); }
      }
      @keyframes floatWave2 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(45px); }
        100% { transform: translateX(0px); }
      }
      .wave1 {
        animation: floatWave1 9s ease-in-out infinite;
      }
      .wave2 {
        animation: floatWave2 7s ease-in-out infinite;
      }
      .footer-quote {
        font-family: 'Fira Code', monospace;
        font-size: 11.5px;
        fill: #88C0D0;
        letter-spacing: 1px;
      }
      .footer-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10px;
        fill: #4C566A;
      }
    </style>
  </defs>

  <rect width="850" height="120" rx="14" fill="url(#footerBg)" />
  <rect width="850" height="120" rx="14" fill="url(#footerGrid)" />

  <g class="wave1">
    <path d="M -50 90 Q 200 40 450 85 T 950 65 L 950 120 L -50 120 Z" fill="url(#waveGrad1)" opacity="0.25" />
  </g>
  <g class="wave2">
    <path d="M -50 75 Q 250 110 500 70 T 950 85 L 950 120 L -50 120 Z" fill="url(#waveGrad2)" opacity="0.2" />
  </g>

  <rect width="848" height="118" x="1" y="1" rx="13" fill="none" stroke="#2e3440" stroke-width="1.2" />

  <g transform="translate(425, 48)">
    <text x="0" y="0" class="footer-quote" text-anchor="middle">⚡ Designed &amp; Engineered by Fatir Gibran</text>
    <text x="0" y="24" class="footer-sub" text-anchor="middle">"Code is like humor. When you have to explain it, it’s bad."</text>
  </g>
</svg>
