<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f293d" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2e3440" stroke-width="0.7" opacity="0.5" />
    </pattern>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: 'Fira Code', Consolas, Monaco, monospace;
        font-size: 14px;
        font-weight: 600;
        fill: #88C0D0;
        letter-spacing: 1.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #ECEFF4;
      }
      .tag-text {
        font-family: 'Fira Code', monospace;
        font-size: 12px;
        fill: #D8DEE9;
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes floatBeam {
        0% { transform: translateX(0px); }
        50% { transform: translateX(35px); }
        100% { transform: translateX(0px); }
      }
      .pulse {
        animation: pulseDot 2s infinite ease-in-out;
        transform-origin: 72px 44px;
      }
      .beam {
        animation: floatBeam 8s infinite ease-in-out;
      }
    </style>
  </defs>

  <rect width="850" height="280" rx="16" fill="url(#bgGrad)" />
  <rect width="850" height="280" rx="16" fill="url(#grid)" />

  <g class="beam" opacity="0.3">
    <circle cx="180" cy="60" r="120" fill="#88C0D0" filter="url(#glow)" opacity="0.2" />
    <circle cx="700" cy="210" r="140" fill="#5E81AC" filter="url(#glow)" opacity="0.25" />
  </g>

  <rect width="848" height="278" x="1" y="1" rx="15" fill="none" stroke="#2e3440" stroke-width="1.5" />

  <g transform="translate(60, 32)">
    <rect width="185" height="24" rx="12" fill="#1e2533" stroke="#3b4252" stroke-width="1" />
    <circle cx="12" cy="12" r="4.5" fill="#A3BE8C" class="pulse" />
    <text x="25" y="16" class="badge-text">OPEN FOR WORK &amp; COLLABS</text>
  </g>

  <g transform="translate(60, 115)">
    <text x="0" y="0" class="title" fill="#ECEFF4">Fatir Gibran</text>
    <text x="0" y="32" class="subtitle">FULL-STACK &amp; APPLIED AI ENGINEER</text>
  </g>

  <g transform="translate(60, 195)">
    <g transform="translate(0, 0)">
      <rect width="125" height="32" rx="8" fill="#1a202c" stroke="#3b4252" stroke-width="1" />
      <text x="62.5" y="20" class="tag-text" text-anchor="middle">⚡ Next.js / TS</text>
    </g>
    <g transform="translate(137, 0)">
      <rect width="115" height="32" rx="8" fill="#1a202c" stroke="#3b4252" stroke-width="1" />
      <text x="57.5" y="20" class="tag-text" text-anchor="middle">🐍 Python AI</text>
    </g>
    <g transform="translate(264, 0)">
      <rect width="105" height="32" rx="8" fill="#1a202c" stroke="#3b4252" stroke-width="1" />
      <text x="52.5" y="20" class="tag-text" text-anchor="middle">🐹 Golang</text>
    </g>
    <g transform="translate(381, 0)">
      <rect width="155" height="32" rx="8" fill="#1a202c" stroke="#3b4252" stroke-width="1" />
      <text x="77.5" y="20" class="tag-text" text-anchor="middle">👁️ Computer Vision</text>
    </g>
  </g>

  <g transform="translate(620, 48)">
    <rect width="170" height="184" rx="12" fill="#131822" stroke="#2e3440" stroke-width="1.5" />
    <line x1="0" y1="30" x2="170" y2="30" stroke="#2e3440" stroke-width="1" />
    <circle cx="16" cy="15" r="3.5" fill="#BF616A" />
    <circle cx="28" cy="15" r="3.5" fill="#EBCB8B" />
    <circle cx="40" cy="15" r="3.5" fill="#A3BE8C" />
    
    <rect x="18" y="48" width="55" height="6" rx="3" fill="#88C0D0" opacity="0.85" />
    <rect x="18" y="66" width="95" height="5" rx="2.5" fill="#4C566A" />
    <rect x="18" y="81" width="70" height="5" rx="2.5" fill="#4C566A" />
    <rect x="18" y="96" width="115" height="5" rx="2.5" fill="#4C566A" />
    
    <rect x="18" y="120" width="40" height="6" rx="3" fill="#81A1C1" opacity="0.85" />
    <rect x="18" y="138" width="85" height="5" rx="2.5" fill="#4C566A" />
    <rect x="18" y="153" width="120" height="5" rx="2.5" fill="#434C5E" />
  </g>
</svg>
