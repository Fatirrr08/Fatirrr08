<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 395" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #1c2331; rx: 16px; }
      .card-border { fill: none; stroke: #2e3440; stroke-width: 1.5; rx: 16px; }
      .section-title { font-family: 'Fira Code', monospace; font-size: 16px; font-weight: 700; fill: #ECEFF4; }
      .th { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: 600; fill: #88C0D0; }
      .row-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 700; fill: #ECEFF4; }
      .row-link { font-family: 'Fira Code', monospace; font-size: 11.5px; font-weight: 600; fill: #88C0D0; text-decoration: none; }
      .row-link:hover { fill: #81A1C1; text-decoration: underline; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #D8DEE9; }
      .pill-bg { rx: 4px; }
      .pill-text { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: 600; fill: #ECEFF4; }
      .divider { stroke: #2e3440; stroke-width: 1; }
    </style>
  </defs>

  <!-- Box Solid Nord -->
  <rect width="850" height="395" class="card-bg" />
  <rect width="848" height="393" x="1" y="1" class="card-border" />

  <!-- Section Title -->
  <text x="35" y="42" class="section-title">⚙️ Backend, Systems &amp; Core Computing</text>

  <!-- Table Header -->
  <rect x="35" y="60" width="780" height="32" rx="6" fill="#242c3d" />
  <text x="50" y="81" class="th">ASSIGNMENT / TOPIC</text>
  <text x="290" y="81" class="th">FOCUS IMPLEMENTATION</text>
  <text x="660" y="81" class="th">TECHNOLOGIES</text>

  <!-- Row 1: Latihan-Golang -->
  <g transform="translate(0, 105)">
    <text x="50" y="20" class="row-title">🐹 Latihan-Golang</text>
    <a href="https://github.com/Fatirrr08/Latihan-Golang" target="_blank">
      <text x="50" y="38" class="row-link">Repo Link ↗</text>
    </a>
    <text x="290" y="20" class="desc">Implementasi konkurensi (Goroutines &amp; Channels), arsitektur REST API,</text>
    <text x="290" y="38" class="desc">dan manipulasi data performa tinggi menggunakan Go murni.</text>
    
    <rect x="660" y="10" width="45" height="20" class="pill-bg" fill="#00ADD8" />
    <text x="682.5" y="24" class="pill-text" text-anchor="middle">Go</text>
    <rect x="711" y="10" width="85" height="20" class="pill-bg" fill="#4C566A" />
    <text x="753.5" y="24" class="pill-text" text-anchor="middle">APIs Backend</text>
    <line x1="35" y1="58" x2="815" y2="58" class="divider" />
  </g>

  <!-- Row 2: JARKOM-TUBES -->
  <g transform="translate(0, 180)">
    <text x="50" y="20" class="row-title">🔌 JARKOM-TUBES</text>
    <a href="https://github.com/Fatirrr08/JARKOM-TUBES" target="_blank">
      <text x="50" y="38" class="row-link">Repo Link ↗</text>
    </a>
    <text x="290" y="20" class="desc">Pemrograman socket jaringan komputer, simulasi pertukaran paket data,</text>
    <text x="290" y="38" class="desc">dan penanganan koneksi antar-node multi-thread.</text>
    
    <rect x="660" y="10" width="60" height="20" class="pill-bg" fill="#3776AB" />
    <text x="690" y="24" class="pill-text" text-anchor="middle">Python</text>
    <rect x="726" y="10" width="70" height="20" class="pill-bg" fill="#D08770" />
    <text x="761" y="24" class="pill-text" text-anchor="middle">Sockets</text>
    <line x1="35" y1="58" x2="815" y2="58" class="divider" />
  </g>

  <!-- Row 3: Library-Pro -->
  <g transform="translate(0, 255)">
    <text x="50" y="20" class="row-title">📚 Library-Pro</text>
    <a href="https://github.com/Fatirrr08/Library-Pro" target="_blank">
      <text x="50" y="38" class="row-link">Repo Link ↗</text>
    </a>
    <text x="290" y="20" class="desc">Sistem Informasi Manajemen Perpustakaan berbasis arsitektur MVC</text>
    <text x="290" y="38" class="desc">dengan manajemen relasi data SQL transaksional.</text>
    
    <rect x="660" y="10" width="45" height="20" class="pill-bg" fill="#ED8B00" />
    <text x="682.5" y="24" class="pill-text" text-anchor="middle">Java</text>
    <rect x="711" y="10" width="60" height="20" class="pill-bg" fill="#4479A1" />
    <text x="741" y="24" class="pill-text" text-anchor="middle">MySQL</text>
    <line x1="35" y1="58" x2="815" y2="58" class="divider" />
  </g>

  <!-- Row 4: AKA -->
  <g transform="translate(0, 330)">
    <text x="50" y="20" class="row-title">📐 AKA (Analisis Kompleksitas)</text>
    <a href="https://github.com/Fatirrr08/AKA" target="_blank">
      <text x="50" y="38" class="row-link">Repo Link ↗</text>
    </a>
    <text x="290" y="20" class="desc">Benchmarking empiris efisiensi algoritma (Big-O ruang dan waktu)</text>
    <text x="290" y="38" class="desc">serta manipulasi struktur data komputasi dinamis.</text>
    
    <rect x="660" y="10" width="60" height="20" class="pill-bg" fill="#3776AB" />
    <text x="690" y="24" class="pill-text" text-anchor="middle">Python</text>
    <rect x="726" y="10" width="80" height="20" class="pill-bg" fill="#B48EAD" />
    <text x="766" y="24" class="pill-text" text-anchor="middle">Algorithms</text>
  </g>
</svg>
